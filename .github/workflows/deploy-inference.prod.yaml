name: Deploy Prod Inference

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "functions/inference/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: functions/inference
    env:
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
      APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs from the repo root; every other run step defaults to functions/inference
      - name: Check inference function directory exists
        working-directory: .
        run: |
          if [ ! -d functions/inference ]; then
            echo "::error::Directory functions/inference does not exist"
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Appwrite CLI
        run: npm install -g appwrite-cli

      - name: Appwrite Essential Secrets
        run: |
          missing=()
          for var in APPWRITE_ENDPOINT APPWRITE_API_KEY APPWRITE_PROJECT_ID; do
            [ -n "${!var}" ] || missing+=("$var")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets/variables: ${missing[*]}"
            exit 1
          fi

      # Saved to the CLI's global prefs once; later steps need no flags.
      - name: Configure Appwrite CLI
        run: |
          appwrite client \
            --endpoint "$APPWRITE_ENDPOINT" \
            --project-id "$APPWRITE_PROJECT_ID" \
            --key "$APPWRITE_API_KEY"

      - name: Verify Appwrite CLI is usable
        run: |
          appwrite --version
          appwrite client --debug

      - name: Create inference function deployment
        run: |
          appwrite functions create-deployment \
            --function-id inference-function \
            --code . \
            --entrypoint src/main.ts \
            --commands "bun install" \
            --activate
